<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — Live Stream</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/hls.min.js"></script>
</head>
<body>
<a href="https://github.com/az7627/live-stream-web" class="github-corner" target="_blank" title="View on GitHub" style="position:fixed;top:16px;right:16px;z-index:9999;color:#fff;opacity:0.7;transition:opacity 0.2s">
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
</a>
  <div class="container">
    <nav class="navbar">
      <div class="brand">
        <span class="dot live"></span>
        <a href="/" style="color:inherit;text-decoration:none;">Live Stream</a>
      </div>
      <a href="/manage" class="btn btn-outline btn-sm">⚙ Manage</a>
      <a href="/" class="btn btn-outline btn-sm">← Back</a>
    </nav>

    <!-- Title -->
    <div class="mb-16" style="display:flex;justify-content:space-between;align-items:center;">
      <h2 id="stream-title">🎬 Loading…</h2>
      <span id="stream-status-badge" class="status-badge status-waiting">
        <span class="status-dot waiting"></span> Waiting
      </span>
    </div>

    <!-- Player + Danmaku -->
    <div class="player-wrapper" id="player-wrapper">
      <video id="video" autoplay playsinline muted></video>

      <!-- Danmaku canvas overlay -->
      <div class="danmaku-overlay" id="danmaku-overlay"></div>

      <!-- Overlay messages -->
      <div class="overlay-msg" id="overlay-waiting">
        <div class="icon">⏳</div>
        <div class="text">Waiting for stream…</div>
        <div class="sub">The streamer hasn't started pushing yet.</div>
      </div>
      <div class="overlay-msg hidden" id="overlay-ended">
        <div class="icon">🔴</div>
        <div class="text">Stream Ended</div>
      </div>
      <div class="overlay-msg hidden" id="overlay-error">
        <div class="icon">⚠️</div>
        <div class="text" id="error-text">Could not load stream.</div>
      </div>

      <!-- Player control buttons -->
      <button class="player-btn" id="refresh-btn" title="Reload stream">⟳</button>
      <button class="player-btn fs-toggle" id="fs-toggle" title="Fullscreen">⛶</button>
    </div>

    <!-- Danmaku input bar -->
    <div class="danmaku-bar">
      <input type="text" id="danmaku-input" placeholder="Type a danmaku…" maxlength="200">
      <button class="btn btn-primary btn-sm" id="danmaku-send">Send</button>
    </div>

    <!-- Re-auth overlay (shown when password changes / session expires) -->
    <div id="reauth-overlay" class="modal-overlay hidden" style="z-index:200;">
      <div class="modal">
        <h2>🔑 Password Required</h2>
        <p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:16px;">
          The viewing password has changed or your session expired.
        </p>
        <div class="form-group">
          <label for="reauth-password">Viewing Password</label>
          <input type="password" id="reauth-password" placeholder="Enter viewing password">
        </div>
        <p id="reauth-error" style="color:var(--danger);font-size:0.85rem;display:none;"></p>
        <button class="btn btn-primary" id="reauth-confirm" style="width:100%;">Watch</button>
      </div>
    </div>

    <!-- Connection status -->
    <p id="ws-status" style="font-size:0.8rem;color:var(--text-muted);margin-top:8px;">
      ● Connecting…
    </p>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/danmaku.js"></script>
  <script>
    /* ── Initialisation ────────────────────────────────────────────────── */

    const streamName = window.location.pathname.replace('/watch/', '');
    let viewPassword = sessionStorage.getItem('view_pwd_' + streamName);

    const titleEl = document.getElementById('stream-title');
    const statusBadge = document.getElementById('stream-status-badge');
    const video = document.getElementById('video');
    const playerWrapper = document.getElementById('player-wrapper');
    const overlayWaiting = document.getElementById('overlay-waiting');
    const overlayEnded = document.getElementById('overlay-ended');
    const overlayError = document.getElementById('overlay-error');
    const errorText = document.getElementById('error-text');
    const danmakuInput = document.getElementById('danmaku-input');
    const danmakuSend = document.getElementById('danmaku-send');
    const wsStatus = document.getElementById('ws-status');
    const fsToggle = document.getElementById('fs-toggle');
    const refreshBtn = document.getElementById('refresh-btn');
    const reauthOverlay = document.getElementById('reauth-overlay');
    const reauthPassword = document.getElementById('reauth-password');
    const reauthError = document.getElementById('reauth-error');
    const reauthConfirm = document.getElementById('reauth-confirm');

    titleEl.textContent = `🎬 ${streamName}`;

    /* ── Validate viewing password first ───────────────────────────────── */

    if (!viewPassword) {
      window.location.href = '/';
    }

    let streamStatus = 'waiting';
    let hls = null;
    let danmaku = null;
    let ws = null;
    let pollTimer = null;
    let pwdValidationTimer = null;
    let isLive = false;

    (async () => {
      try {
        const data = await apiPost('/api/streams/validate_view', {
          stream_name: streamName,
          password: viewPassword,
        });
        streamStatus = data.status;
        updateStatusUI(streamStatus);

        if (streamStatus === 'ended') {
          showOverlay('ended');
          startPwdValidation();
          return;
        }

        initDanmaku();
        connectWebSocket();
        startPwdValidation();

        if (streamStatus === 'live') {
          startHls();
        } else {
          pollForStream();
        }
      } catch (err) {
        showOverlay('error');
        errorText.textContent = 'Access denied: ' + err.message;
      }
    })();

    /* ── Status UI ─────────────────────────────────────────────────────── */

    function updateStatusUI(status) {
      const dot = statusBadge.querySelector('.status-dot');
      const label = statusBadge.querySelector('span:last-child');
      statusBadge.className = 'status-badge';

      if (status === 'live') {
        statusBadge.classList.add('status-live');
        dot.className = 'status-dot live';
        label.textContent = 'LIVE';
        overlayWaiting.classList.add('hidden');
        overlayEnded.classList.add('hidden');
        overlayError.classList.add('hidden');
      } else if (status === 'waiting') {
        statusBadge.classList.add('status-waiting');
        dot.className = 'status-dot waiting';
        label.textContent = 'Waiting';
      } else {
        statusBadge.classList.add('status-ended');
        dot.className = 'status-dot ended';
        label.textContent = 'Ended';
      }
    }

    function showOverlay(type) {
      overlayWaiting.classList.add('hidden');
      overlayEnded.classList.add('hidden');
      overlayError.classList.add('hidden');
      if (type === 'waiting') overlayWaiting.classList.remove('hidden');
      if (type === 'ended') overlayEnded.classList.remove('hidden');
      if (type === 'error') overlayError.classList.remove('hidden');
    }

    /* ── HLS playback via hls.js ───────────────────────────────────────── */

    function startHls() {
      if (hls) return;
      isLive = true;
      showOverlay('waiting');

      const hlsUrl = `/hls/live/${encodeURIComponent(streamName)}/index.m3u8`;

      if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = false;
          video.play().catch(() => {});
          showOverlay(null);
        });
        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (data.fatal) {
            checkStreamEnded();
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = hlsUrl;
        video.addEventListener('loadedmetadata', () => {
          video.muted = false;
          video.play().catch(() => {});
          showOverlay(null);
        });
      } else {
        showOverlay('error');
        errorText.textContent = 'HLS is not supported in this browser.';
      }
    }

    /**
     * Reload the HLS stream without refreshing the page.
     * Destroys the current hls.js instance and creates a fresh one.
     */
    function reloadStream() {
      if (hls) {
        hls.destroy();
        hls = null;
      } else {
        video.src = '';
        video.load();
      }
      isLive = false;
      showOverlay('waiting');
      // Small delay ensures old segments are cleared
      setTimeout(() => startHls(), 500);
    }

    refreshBtn.addEventListener('click', reloadStream);

    /* ── Poll for stream to go live ────────────────────────────────────── */

    function pollForStream() {
      pollTimer = setInterval(async () => {
        try {
          const data = await apiPost('/api/streams/validate_view', {
            stream_name: streamName,
            password: viewPassword,
          });
          updateStatusUI(data.status);
          if (data.status === 'live') {
            clearInterval(pollTimer);
            pollTimer = null;
            setTimeout(() => startHls(), 3000);
          } else if (data.status === 'ended') {
            clearInterval(pollTimer);
            pollTimer = null;
            showOverlay('ended');
          }
        } catch (_) {}
      }, 3000);
    }

    async function checkStreamEnded() {
      try {
        const data = await apiPost('/api/streams/validate_view', {
          stream_name: streamName,
          password: viewPassword,
        });
        if (data.status === 'ended' || data.status === 'waiting') {
          showOverlay('ended');
          updateStatusUI('ended');
        }
      } catch (_) {}
    }

    /* ── Periodic password validation (every 60s, 10s timeout) ─────────── */

    function startPwdValidation() {
      if (pwdValidationTimer) return;
      pwdValidationTimer = setInterval(async () => {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);
          await apiPost('/api/streams/validate_view', {
            stream_name: streamName,
            password: viewPassword,
          }, { signal: controller.signal });
          clearTimeout(timeoutId);
        } catch (_) {
          stopPwdValidation();
          showReauthOverlay();
        }
      }, 60000);
    }

    function stopPwdValidation() {
      if (pwdValidationTimer) {
        clearInterval(pwdValidationTimer);
        pwdValidationTimer = null;
      }
    }

    /* ── Re-authentication overlay ──────────────────────────────────────── */

    function showReauthOverlay() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (hls) { hls.destroy(); hls = null; isLive = false; }
      if (danmaku) { danmaku.destroy(); danmaku = null; }
      if (ws) { try { ws.close(); } catch {} ws = null; }
      stopPwdValidation();
      video.src = '';
      video.load();
      reauthPassword.value = '';
      reauthError.style.display = 'none';
      reauthOverlay.classList.remove('hidden');
      reauthPassword.focus();
    }

    async function handleReauth() {
      const pwd = reauthPassword.value.trim();
      if (!pwd) return;
      reauthConfirm.disabled = true;
      reauthConfirm.textContent = 'Verifying…';
      try {
        await apiPost('/api/streams/validate_view', {
          stream_name: streamName,
          password: pwd,
        });
        viewPassword = pwd;
        sessionStorage.setItem('view_pwd_' + streamName, pwd);
        reauthOverlay.classList.add('hidden');
        reauthError.style.display = 'none';
        reauthConfirm.disabled = false;
        reauthConfirm.textContent = 'Watch';

        // Re-init everything
        initDanmaku();
        connectWebSocket();
        startPwdValidation();
        streamStatus = 'live';
        updateStatusUI('live');
        startHls();
      } catch (err) {
        reauthError.textContent = err.message;
        reauthError.style.display = 'block';
        reauthConfirm.disabled = false;
        reauthConfirm.textContent = 'Watch';
        reauthPassword.focus();
      }
    }

    reauthConfirm.addEventListener('click', handleReauth);
    reauthPassword.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleReauth();
    });

    /* ── Danmaku ───────────────────────────────────────────────────────── */

    function initDanmaku() {
      const overlay = document.getElementById('danmaku-overlay');
      danmaku = new Danmaku(overlay);
      danmaku.start();
    }

    function connectWebSocket() {
      const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const wsUrl = `${proto}://${window.location.host}/ws/${encodeURIComponent(streamName)}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        wsStatus.textContent = '● Connected — danmaku enabled';
        wsStatus.style.color = 'var(--success)';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'danmaku' && danmaku) {
            const colors = ['#FFFFFF', '#FFD700', '#00E5FF', '#FF4081', '#B388FF', '#69F0AE'];
            const color = msg.color || colors[Math.floor(Math.random() * colors.length)];
            danmaku.send(msg.text, color);
          }
        } catch (_) {}
      };

      ws.onclose = () => {
        wsStatus.textContent = '● Disconnected — danmaku unavailable';
        wsStatus.style.color = 'var(--danger)';
        setTimeout(() => {
          if (document.hidden) return;
          connectWebSocket();
        }, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    /* ── Send danmaku ──────────────────────────────────────────────────── */

    function sendDanmaku() {
      const text = danmakuInput.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

      ws.send(JSON.stringify({ type: 'danmaku', text }));
      danmaku.send(text, '#FFFFFF');
      danmakuInput.value = '';
    }

    danmakuSend.addEventListener('click', sendDanmaku);
    danmakuInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendDanmaku();
    });

    /* ── Fullscreen ─────────────────────────────────────────────────────── */

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        playerWrapper.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    fsToggle.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement === playerWrapper) {
        fsToggle.classList.add('active');
        fsToggle.title = 'Exit fullscreen';
      } else {
        fsToggle.classList.remove('active');
        fsToggle.title = 'Fullscreen';
      }
      window.dispatchEvent(new Event('resize'));
    });

    /* ── Cleanup ───────────────────────────────────────────────────────── */

    window.addEventListener('beforeunload', () => {
      if (pollTimer) clearInterval(pollTimer);
      if (hls) hls.destroy();
      if (ws) ws.close();
      if (danmaku) danmaku.destroy();
      stopPwdValidation();
    });
  </script>
</body>
</html>
