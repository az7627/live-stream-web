<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <link rel="stylesheet" href="/live/static/css/style.css">
</head>
<body>
<a href="https://github.com/az7627/live-stream-web" class="github-corner" target="_blank" title="View on GitHub" style="position:fixed;top:16px;right:16px;z-index:9999;color:#fff;opacity:0.7;transition:opacity 0.2s">
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
</a>
  <div class="container">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="brand">
        <span class="dot live"></span>
        Live Stream
      </div>
      <a href="/live/manage" class="btn btn-primary">⚙ Manage</a>
    </nav>

    <!-- Stream list -->
    <h2 class="mb-16">🎬 Active Streams</h2>
    <div id="stream-list">
      <div class="empty-state">
        <div class="icon">📺</div>
        <p>No active streams right now.</p>
        <p class="sub mt-8" style="color:var(--text-muted);font-size:0.9rem;">
          <a href="/live/go-live">Start one</a> and share the link!
        </p>
      </div>
    </div>
  </div>

  <!-- Password modal -->
  <div id="password-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>🔑 Enter Viewing Password</h2>
      <div class="form-group">
        <label for="modal-password">Password</label>
        <input type="password" id="modal-password" placeholder="Enter password">
      </div>
      <p id="modal-error" style="color:var(--danger);font-size:0.85rem;display:none;"></p>
      <div class="actions">
        <button class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Watch</button>
      </div>
    </div>
  </div>

  <script src="/live/static/js/app.js"></script>
  <script>
    const listEl = document.getElementById('stream-list');
    const modalOverlay = document.getElementById('password-modal');
    const modalPassword = document.getElementById('modal-password');
    const modalError = document.getElementById('modal-error');
    const modalCancel = document.getElementById('modal-cancel');
    const modalConfirm = document.getElementById('modal-confirm');

    let pendingStream = ''; // stream name waiting for password

    async function loadStreams() {
      try {
        const streams = await api('/api/streams');
        renderStreams(streams);
      } catch (err) {
        listEl.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">Failed to load streams: ${esc(err.message)}</p></div>`;
      }
    }

    function renderStreams(streams) {
      if (!streams || streams.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">📺</div>
            <p>No active streams right now.</p>
            <p class="sub mt-8" style="color:var(--text-muted);font-size:0.9rem;">
              <a href="/live/go-live">Start one</a> and share the link!
            </p>
          </div>`;
        return;
      }

      let html = '<div class="stream-list">';
      for (const s of streams) {
        const statusClass = s.status === 'live' ? 'status-live' : s.status === 'waiting' ? 'status-waiting' : 'status-ended';
        const dotClass = s.status === 'live' ? 'live' : s.status === 'waiting' ? 'waiting' : 'ended';
        const label = s.status === 'live' ? 'LIVE' : s.status === 'waiting' ? 'Waiting' : 'Ended';
        const started = s.started_at
          ? new Date(s.started_at).toLocaleTimeString()
          : s.created_at
            ? new Date(s.created_at).toLocaleTimeString()
            : '--';

        html += `
          <div class="stream-item">
            <div class="info">
              <div class="name">${esc(s.name)}</div>
              <div class="meta">
                <span class="status-badge ${statusClass}">
                  <span class="status-dot ${dotClass}"></span>
                  ${label}
                </span>
                &middot; ${started}
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-primary btn-sm" onclick="promptPassword('${esc(s.name)}')">▶ Watch</button>
            </div>
          </div>`;
      }
      html += '</div>';
      listEl.innerHTML = html;
    }

    /* ── Password modal ────────────────────────────────────────────────── */

    function promptPassword(streamName) {
      pendingStream = streamName;
      modalPassword.value = '';
      modalError.style.display = 'none';
      modalError.textContent = '';
      modalOverlay.classList.remove('hidden');
      modalPassword.focus();
    }

    modalCancel.addEventListener('click', () => {
      modalOverlay.classList.add('hidden');
      pendingStream = '';
    });

    modalConfirm.addEventListener('click', async () => {
      const pwd = modalPassword.value.trim();
      if (!pwd) {
        showModalError('Please enter a password.');
        return;
      }
      try {
        await apiPost('/api/streams/validate_view', {
          stream_name: pendingStream,
          password: pwd,
        });
        modalOverlay.classList.add('hidden');
        // Store in sessionStorage — never put the password in the URL
        sessionStorage.setItem('view_pwd_' + pendingStream, pwd);
        window.location.href = `/live/watch/${encodeURIComponent(pendingStream)}`;
      } catch (err) {
        showModalError(err.message);
      }
    });

    modalPassword.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') modalConfirm.click();
      if (e.key === 'Escape') modalCancel.click();
    });

    function showModalError(msg) {
      modalError.textContent = msg;
      modalError.style.display = 'block';
    }

    // Auto-refresh stream list every 10 seconds
    loadStreams();
    setInterval(loadStreams, 10000);
  </script>
</body>
</html>
